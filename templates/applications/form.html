{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post" class="panel form" novalidate>
  {% csrf_token %}
  {% include "_form_fields.html" %}
  <div class="actions">
    <button class="btn btn-primary" type="submit">Save application</button>
    <a href="{% if object %}{{ object.get_absolute_url }}{% else %}{% url 'applications:list' %}{% endif %}">Cancel</a>
  </div>
</form>
{% endblock %}
